replicaCount: 1
image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 5000
  targetPort: 5000
db:
  host: postgres
  port: 5432
  database: cloudcart
  username: cloudcart
  password: cloudcart123
secretKey: super-secret-key
env:
  FLASK_DEBUG: "false"
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 512Mi

# Requires the Prometheus Operator CRDs (monitoring.coreos.com/v1) to be
# installed in the cluster. Rendering this unconditionally makes
# `helm upgrade --install` of the whole chart fail on any cluster without
# them, with an opaque "no matches for kind ServiceMonitor" error — the
# workloads themselves are fine, but the release never converges.
# Install helm/bootstrap first (it brings the CRDs), or leave this false.
serviceMonitor:
  enabled: false
