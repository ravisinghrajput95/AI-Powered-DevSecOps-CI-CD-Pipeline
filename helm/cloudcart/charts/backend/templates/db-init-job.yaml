apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-init
  namespace: {{ .Values.global.namespace | default "cloudcart" }}
  annotations:
    # Run this job only on install, not on upgrade
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.db.host }} {{ .Values.db.port }}; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
      containers:
        - name: db-init
          image: postgres:13
          command:
            - sh
            - -c
            - |
              echo "Running init.sql..."
              psql $DATABASE_URL -f /init/init.sql
              echo "Database initialized!"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-backend-secret
                  key: DATABASE_URL
          volumeMounts:
            - name: init-sql
              mountPath: /init
      volumes:
        - name: init-sql
          configMap:
            # Created by the postgresql chart (helm/postgresql/templates/
            # configmap-init-sql.yaml) as `db-schema-sql`, with schema.sql
            # under the `init.sql` key. This previously read `db-init-sql`,
            # a name nothing creates, so the volume never mounted and the
            # post-install hook hung until Helm timed out and marked the
            # whole cloudcart release failed — even though all three app
            # pods were running fine.
            #
            # NOTE: this is a cross-release dependency — the ConfigMap lives
            # in the `postgres` release, not this one. Installing cloudcart
            # into a namespace where the postgresql chart has not been
            # installed first will fail the same way.
            name: db-schema-sql
