name: Frontend CI

# ─────────────────────────────────────────────────────────────────────
# NOTE ON DUPLICATION — this overlaps heavily with backend-ci.yaml, and that is
# DELIBERATE. Do not merge them into a reusable (workflow_call) workflow.
#
# The docker job signs its image with Cosign keyless signing, and
# deploy-frontend.yaml gates deployment on:
#
#   cosign verify --certificate-identity \
#     ".../.github/workflows/frontend-ci.yaml@refs/heads/main"
#
# Cosign binds the certificate to the workflow file that requested the OIDC
# token. Inside a reusable workflow the token's job_workflow_ref — and
# therefore the certificate SAN — becomes the REUSABLE workflow's path, not
# this caller's. Two consequences:
#
#   1. cosign verify fails and deploys stop (fail-closed, so at least loud).
#   2. "Fixing" it by pointing --certificate-identity at the shared workflow
#      makes backend and frontend images signed by the SAME identity. The
#      certificate would no longer prove which pipeline built which image,
#      so a compromised frontend pipeline could sign a backend image.
#
# That is a real provenance regression traded for tidier YAML. The jobs that
# are safe to share (lint/test/build) are also the ones that differ most
# (setup-python + black/flake8/isort vs setup-node + ESLint), so there is
# little left to gain.
#
# Assessed 2026-07-25. If this is revisited, verify with a real signed image
# that the certificate identity still binds per component before merging.
# ─────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "helm/cloudcart/charts/frontend/**"
      - "helm/cloudcart/Chart.yaml"
      - "helm/cloudcart/values.yaml"

  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - "helm/cloudcart/charts/frontend/**"
      - "helm/cloudcart/Chart.yaml"
      - "helm/cloudcart/values.yaml"

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_REPOSITORY_FRONTEND: ${{ secrets.GAR_REPOSITORY_FRONTEND }}
  GAR_REGION: ${{ secrets.GAR_REGION }}
  FRONTEND_IMAGE_NAME: ${{ secrets.FRONTEND_IMAGE_NAME }}

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Run Jest Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:frontend -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  build:
    name: Vite Build
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist
          path: frontend/dist/

  docker:
    name: Docker Build & Push to GCR
    runs-on: ubuntu-latest
    needs: [ build, test]
    permissions:
      contents: read
      id-token: write
    # See backend-ci.yaml's docker job for the full reasoning — Dependabot
    # PRs use a separate secrets store, so the GCP auth step cannot succeed.
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
            version: '>= 363.0.0'

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker $GAR_REGION-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
           docker build \
           -t $GAR_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY_FRONTEND/$FRONTEND_IMAGE_NAME:${{ github.sha }} \
           -t $GAR_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY_FRONTEND/$FRONTEND_IMAGE_NAME:latest \
           ./frontend

      # Report-only, matching GitGuardian's warn-only philosophy elsewhere in
      # this pipeline: a critical CVE in a base image doesn't block the push.
      # Runs the Snyk CLI directly (rather than the snyk/actions/docker
      # wrapper action) for full control over JSON report generation —
      # the wrapper's SARIF output proved unreliable.
      - name: Install Snyk CLI
        uses: snyk/actions/setup@8e119fbb6c251787721d34ba683ed48eba792766 # master

      - name: Scan image with Snyk
        id: snyk_scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          # No --severity-threshold: the scanner's job is to report facts,
          # and the artifact is the audit record. Filtering here destroyed
          # data irrecoverably — on 2026-07-25 --severity-threshold=critical
          # reported the frontend image as having "No known operating system
          # vulnerabilities" while Snyk's own output in the same report
          # listed 182 (0 critical, 15 high, 6 medium, 161 low). Which
          # findings reach the AI is decided downstream, where it can be
          # changed without re-running scans.
          snyk container test \
            $GAR_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY_FRONTEND/$FRONTEND_IMAGE_NAME:${{ github.sha }} \
            --file=frontend/Dockerfile \
            --json-file-output=snyk-frontend.json
          exit_code=$?
          set -e
          case $exit_code in
            0) echo "Snyk scan: no vulnerabilities at or above the threshold."; echo "completed=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "Snyk scan: vulnerabilities found (report-only, not blocking push)."; echo "completed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::warning::Snyk scan did not complete cleanly (exit code $exit_code) — check the log above. The report may be missing or incomplete."; echo "completed=false" >> "$GITHUB_OUTPUT" ;;
          esac
          exit 0

      - name: Upload Snyk scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: snyk-frontend-report
          path: snyk-frontend.json
          if-no-files-found: ignore

      - name: Normalize Snyk findings
        if: always()
        run: python3 scripts/normalize_snyk.py normalized-snyk-frontend.json snyk-frontend.json

      - name: Upload normalized Snyk findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: normalized-snyk-frontend
          path: normalized-snyk-frontend.json
          if-no-files-found: ignore

      # See backend-ci.yaml's identical step for why this exists.
      - name: Generate SBOM with Syft
        id: syft
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.GAR_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY_FRONTEND }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-frontend.spdx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-frontend
          path: sbom-frontend.spdx.json
          if-no-files-found: ignore

      - name: Normalize SBOM
        if: always()
        run: python3 scripts/normalize_sbom.py normalized-sbom-frontend.json sbom-frontend.spdx.json frontend

      - name: Upload normalized SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: normalized-sbom-frontend
          path: normalized-sbom-frontend.json
          if-no-files-found: ignore

      # MUST run after the SBOM steps: this records syft's outcome and
      # verifies the SPDX file actually contains packages. It previously
      # sat before 'Generate SBOM with Syft', so the check ran one second
      # too early, found no file, and recorded syft as failed on every
      # build while syft was producing a ~400KB SBOM.
      - name: Record scan status
        if: always()
        run: |
          # syft: the step outcome alone isn't enough — sbom-action can exit 0
          # having written nothing useful. Require a non-trivial SPDX file
          # with at least one package, so "success" means an SBOM actually
          # exists rather than merely that the action didn't error.
          SYFT_STATUS="failed"
          if [ "${{ steps.syft.outcome }}" = "success" ] \
             && [ -s sbom-frontend.spdx.json ] \
             && python3 -c "import json,sys; d=json.load(open('sbom-frontend.spdx.json')); sys.exit(0 if d.get('packages') else 1)" 2>/dev/null; then
            SYFT_STATUS="success"
          fi
          echo "syft status: $SYFT_STATUS"

          cat > scan_status_frontend_docker.json << EOF
          {"snyk": "${{ steps.snyk_scan.outputs.completed == 'true' && 'success' || 'failed' }}", "syft": "$SYFT_STATUS"}
          EOF
          cat scan_status_frontend_docker.json

      - name: Upload scan status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scan-status-frontend-docker
          path: scan_status_frontend_docker.json

      # Scans the same local (pre-push) image — no registry auth needed, since
      # the Docker daemon already has it loaded from the build step above.
      # upload-artifact: false because the action's own built-in uploader
      # needs `contents: write`, which this job intentionally doesn't grant —
      # uploading explicitly below instead, same pattern as the Snyk report.


      - name: Push Docker image
        run: |
           docker push $GAR_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY_FRONTEND/$FRONTEND_IMAGE_NAME:${{ github.sha }}
           docker push $GAR_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY_FRONTEND/$FRONTEND_IMAGE_NAME:latest

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless signing: signs the image just pushed, using the GitHub Actions
      # OIDC token already enabled by `id-token: write` above (same permission
      # used for GCP WIF auth, different audience — no conflict). No private
      # key to store or rotate; Fulcio issues a short-lived cert tied to this
      # exact workflow/repo/commit, and the signature + cert are recorded in
      # Rekor's public transparency log.
      - name: Sign image with Cosign (keyless)
        run: |
          cosign sign --yes \
            $GAR_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY_FRONTEND/$FRONTEND_IMAGE_NAME:${{ github.sha }}