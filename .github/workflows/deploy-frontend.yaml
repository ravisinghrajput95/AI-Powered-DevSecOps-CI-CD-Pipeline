name: Deploy Frontend to GKE

on:
  workflow_run:
    workflows:
      - "Frontend CI"
    types:
      - completed

permissions:
  contents: read
  id-token: write

env:
  NAMESPACE: cloudcart
  RELEASE_NAME: cloudcart
  CHART_PATH: ./helm/cloudcart
  GAR_REGION: ${{ secrets.GAR_REGION }}
  FRONTEND_IMAGE: ${{ secrets.GAR_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY_FRONTEND }}/${{ secrets.FRONTEND_IMAGE_NAME }}

jobs:
  deploy:
    # See deploy-backend.yaml's deploy job for the full reasoning: without
    # the event/head_branch guards, a green PR build deploys unmerged code,
    # and a Dependabot PR deploys an image tag that was never built.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && (github.event.workflow_run.event == 'push'
              || github.event.workflow_run.event == 'workflow_dispatch')
          && github.event.workflow_run.head_branch == 'main' }}
    name: Deploy Frontend via Helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
            version: '>= 363.0.0'

      - name: Configure Docker for GAR
        run: gcloud auth configure-docker $GAR_REGION-docker.pkg.dev --quiet

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Fail-closed gate: refuses to deploy unless this exact image digest was
      # signed by the Frontend CI workflow, in this repo, on main. Anything
      # unsigned, signed by a different workflow/repo, or tampered with after
      # signing fails verification and the job stops here — Helm never runs.
      - name: Verify image signature with Cosign
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/frontend-ci.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ env.FRONTEND_IMAGE }}:${{ github.event.workflow_run.head_sha }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_REGION }}

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: "3.14.0"

      - name: Update chart dependencies
        run: helm dependency update ${{ env.CHART_PATH }}

      - name: Ensure namespace exists
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} \
          --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy frontend via Helm
        run: |
          # See deploy-backend.yaml for the full reasoning. Short version:
          # --atomic rolls back on an UPGRADE (good) but UNINSTALLS on a
          # first INSTALL, destroying the failed pods and events that
          # explain the failure. Timeout raised 120s -> 600s because a cold
          # start on a fresh node pool exceeds two minutes and the old value
          # turned "slow" into "deleted".
          if helm status ${{ env.RELEASE_NAME }} -n ${{ env.NAMESPACE }} >/dev/null 2>&1; then
            ATOMIC="--atomic"
            echo "Existing release found — deploying with --atomic (rollback on failure)."
          else
            ATOMIC=""
            echo "First install — deploying WITHOUT --atomic so a failed release stays inspectable."
          fi
          helm upgrade --install ${{ env.RELEASE_NAME }} ${{ env.CHART_PATH }} \
            --namespace ${{ env.NAMESPACE }} \
            --set frontend.image.repository=${{ env.FRONTEND_IMAGE }} \
            --set frontend.image.tag=${{ github.event.workflow_run.head_sha }} \
            --reuse-values \
            $ATOMIC \
            --wait \
            --timeout 600s

      - name: Verify frontend rollout
        run: |
          kubectl rollout status deployment/${{ env.RELEASE_NAME }}-frontend \
            --namespace ${{ env.NAMESPACE }} \
            --timeout=120s