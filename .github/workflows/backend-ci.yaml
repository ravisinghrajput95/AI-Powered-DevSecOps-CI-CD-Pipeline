name: Backend CI

# ─────────────────────────────────────────────────────────────────────
# NOTE ON DUPLICATION — this overlaps heavily with frontend-ci.yaml, and that is
# DELIBERATE. Do not merge them into a reusable (workflow_call) workflow.
#
# The docker job signs its image with Cosign keyless signing, and
# deploy-backend.yaml gates deployment on:
#
#   cosign verify --certificate-identity \
#     ".../.github/workflows/backend-ci.yaml@refs/heads/main"
#
# Cosign binds the certificate to the workflow file that requested the OIDC
# token. Inside a reusable workflow the token's job_workflow_ref — and
# therefore the certificate SAN — becomes the REUSABLE workflow's path, not
# this caller's. Two consequences:
#
#   1. cosign verify fails and deploys stop (fail-closed, so at least loud).
#   2. "Fixing" it by pointing --certificate-identity at the shared workflow
#      makes backend and frontend images signed by the SAME identity. The
#      certificate would no longer prove which pipeline built which image,
#      so a compromised frontend pipeline could sign a backend image.
#
# That is a real provenance regression traded for tidier YAML. The jobs that
# are safe to share (lint/test/build) are also the ones that differ most
# (setup-python + black/flake8/isort vs setup-node + ESLint), so there is
# little left to gain.
#
# Assessed 2026-07-25. If this is revisited, verify with a real signed image
# that the certificate identity still binds per component before merging.
# ─────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "helm/cloudcart/charts/backend/**"
      - "helm/cloudcart/Chart.yaml"
      - "helm/cloudcart/values.yaml"

  workflow_dispatch:
    
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "helm/cloudcart/charts/backend/**"
      - "helm/cloudcart/Chart.yaml"
      - "helm/cloudcart/values.yaml"

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_REPOSITORY_BACKEND: ${{ secrets.GAR_REPOSITORY_BACKEND }}
  GAR_REGION: ${{ secrets.GAR_REGION }}
  BACKEND_IMAGE_NAME: ${{ secrets.BACKEND_IMAGE_NAME }}

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install linting tools
        # Same manifest the pre-commit hook's formatters come from, so CI and
        # local hooks can't drift onto different black/isort versions and
        # disagree about formatting.
        # Path is relative to this job's `working-directory: backend`, hence
        # no `backend/` prefix — unlike cache-dependency-path above, which is
        # an action input and so resolves from the repo root instead.
        run: pip install -r requirements-dev.txt

      - name: Check formatting with black
        run: python -m black --check .

      - name: Run flake8
        run: python -m flake8 .
        # Uses root setup.cfg for config

      - name: Check import order with isort
        run: python -m isort --check-only .
  
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloudcart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Run tests
        working-directory: backend
        run: |
          if [ -d tests ]; then
            python -m pytest --cov=. --cov-report=xml --cov-report=term
          else
            echo "No tests found, skipping."
          fi
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cloudcart_test
          FLASK_ENV: testing
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: backend/coverage.xml

  docker:
    name: Docker Build & Push to GCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: test
    # Skipped for Dependabot PRs. Dependabot runs against a separate secrets
    # store, so secrets.GCP_WIF_PROVIDER / GCP_SERVICE_ACCOUNT resolve to
    # empty strings here and the GCP auth step fails — a permissions fact,
    # not a broken build. Lint, tests, and the security scans all still run,
    # which is what actually matters for reviewing a dependency bump; only
    # the registry push is skipped. A `skipped` job does not fail the run,
    # so deploy-backend.yaml's `conclusion == 'success'` guard still holds.
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
            version: '>= 363.0.0'

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker $GAR_REGION-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
           docker build \
           -t $GAR_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY_BACKEND/$BACKEND_IMAGE_NAME:${{ github.sha }} \
           -t $GAR_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY_BACKEND/$BACKEND_IMAGE_NAME:latest \
           ./backend

      # Report-only, matching GitGuardian's warn-only philosophy elsewhere in
      # this pipeline: a critical CVE in a base image doesn't block the push.
      # Runs the Snyk CLI directly (rather than the snyk/actions/docker
      # wrapper action) for full control over JSON report generation —
      # the wrapper's SARIF output proved unreliable.
      - name: Install Snyk CLI
        uses: snyk/actions/setup@8e119fbb6c251787721d34ba683ed48eba792766 # master

      - name: Scan image with Snyk
        id: snyk_scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk container test \
            $GAR_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY_BACKEND/$BACKEND_IMAGE_NAME:${{ github.sha }} \
            --file=backend/Dockerfile \
            --severity-threshold=high \
            --json-file-output=snyk-backend.json
          exit_code=$?
          set -e
          case $exit_code in
            0) echo "Snyk scan: no vulnerabilities at or above the threshold."; echo "completed=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "Snyk scan: vulnerabilities found (report-only, not blocking push)."; echo "completed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::warning::Snyk scan did not complete cleanly (exit code $exit_code) — check the log above. The report may be missing or incomplete."; echo "completed=false" >> "$GITHUB_OUTPUT" ;;
          esac
          exit 0

      - name: Upload Snyk scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: snyk-backend-report
          path: snyk-backend.json
          if-no-files-found: ignore

      - name: Normalize Snyk findings
        if: always()
        run: python3 scripts/normalize_snyk.py normalized-snyk-backend.json snyk-backend.json

      - name: Upload normalized Snyk findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: normalized-snyk-backend
          path: normalized-snyk-backend.json
          if-no-files-found: ignore

      # Closes a real, known gap: scan_status.backend.snyk (container scan,
      # distinct from snyk_sca) used to be unconditionally hardcoded to
      # "not_configured" in release-readiness.yaml regardless of whether
      # this scan actually ran — not because the scan was missing (it's
      # been running and producing real findings all along, see
      # normalized-snyk-backend above), only because nothing recorded its
      # outcome. Mirrors the exact "Record scan status" pattern already
      # proven in app-security-scan-backend.yaml's normalize-and-merge job.
      - name: Record scan status
        if: always()
        run: |
          cat > scan_status_backend_docker.json << EOF
          {"snyk": "${{ steps.snyk_scan.outputs.completed == 'true' && 'success' || 'failed' }}"}
          EOF
          cat scan_status_backend_docker.json

      - name: Upload scan status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scan-status-backend-docker
          path: scan_status_backend_docker.json

      # Scans the same local (pre-push) image — no registry auth needed, since
      # the Docker daemon already has it loaded from the build step above.
      # upload-artifact: false because the action's own built-in uploader
      # needs `contents: write`, which this job intentionally doesn't grant —
      # uploading explicitly below instead, same pattern as the Snyk report.
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.GAR_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY_BACKEND }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-backend.spdx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-backend
          path: sbom-backend.spdx.json
          if-no-files-found: ignore

      - name: Normalize SBOM
        if: always()
        run: python3 scripts/normalize_sbom.py normalized-sbom-backend.json sbom-backend.spdx.json backend

      - name: Upload normalized SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: normalized-sbom-backend
          path: normalized-sbom-backend.json
          if-no-files-found: ignore

      - name: Push Docker image
        run: |
           docker push $GAR_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY_BACKEND/$BACKEND_IMAGE_NAME:${{ github.sha }}
           docker push $GAR_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY_BACKEND/$BACKEND_IMAGE_NAME:latest

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless signing: signs the image just pushed, using the GitHub Actions
      # OIDC token already enabled by `id-token: write` above (same permission
      # used for GCP WIF auth, different audience — no conflict). No private
      # key to store or rotate; Fulcio issues a short-lived cert tied to this
      # exact workflow/repo/commit, and the signature + cert are recorded in
      # Rekor's public transparency log.
      - name: Sign image with Cosign (keyless)
        run: |
          cosign sign --yes \
            $GAR_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY_BACKEND/$BACKEND_IMAGE_NAME:${{ github.sha }}